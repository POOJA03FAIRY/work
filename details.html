<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration</title>
    <style>
       @font-face {
        font-family: 'Lufga';
        src: url('fonts/Lufga.ttf') format('truetype'); 
        font-weight: normal;
        font-style: normal;
         }
        * {
            font-family: 'Lufga', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           
        }

        body {
            
            background: url('doce.webp') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Lufga', sans-serif;
        }

        .container {
            background: white;
            font-family: 'Lufga', sans-serif;
            padding: 40px;
            border-radius: 10px;
            width: 380px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        h4 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #0d66be;
            font-family: 'Lufga', sans-serif;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
            font-family: 'Lufga', sans-serif;
            cursor: pointer;
        }

        .input-group label {
            position: absolute;
            left: 10px;
            top: -8px;
            background-color: rgb(255, 255, 255);
            padding: 3px;
            font-size: 10px;
            font-family: 'Lufga', sans-serif;
            color: #115db4;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #115db4;
            border-radius: 25px;
            font-size: 12px;
            outline: none;
            background-color: #ffffff;
            transition: all 0.3s ease;
            cursor: pointer;
            font-family: 'Lufga', sans-serif;
        }

        .input-group input:focus {
            border-color: #007bff;
            background-color: #e7f3ff;
            font-family: 'Lufga', sans-serif;
        }

        .arrow {
            position: absolute;
            right: 15px;
            top: 35%;
            transform: translateY(-50%);
            font-size: 18px;
            cursor: pointer;
            color: #007bff;
            font-family: 'Lufga', sans-serif;
        }

        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            display: none;
            z-index: 2;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Lufga', sans-serif;
        }

        .dropdown.active {
            display: block;
        }

        .dropdown div {
            padding: 10px;
            text-align: left;
            cursor: pointer;
            font-family: 'Lufga', sans-serif;
            

         
        }

        .dropdown div:hover {
            background-color: #007bff;
            color: white;
        }

        .highlight {
            background-color: #f9fafa;
            color: #341515;
            border: 1px solid #3a5879;
            font-family: 'Lufga', sans-serif;
        }

        .continue-btn {
            width: 100%;
            padding: 12px;
            background: #143c67;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Lufga', sans-serif;
        }

        .continue-btn:hover {
            background: #0056b3;
            font-family: 'Lufga', sans-serif;
        }
    </style>
</head>
<body>

    <div class="container">
        <h4>Enter your Educational Details</h4>

        <div class="input-group" onclick="toggleDropdown('degree-dropdown')">
            <label for="Degree">Degree</label>
            <input type="text" id="Degree" readonly placeholder="Select Degree">
            <span class="arrow">⌄</span>
            <div class="dropdown" id="degree-dropdown">
                <div onclick="setValue('Degree', 'MBBS')">MBBS</div>
                <div onclick="setValue('Degree', 'DENTIST')">DENTIST</div>
                <div onclick="setValue('Degree', 'CARDIOLOGIST')">CARDIOLOGIST</div>
                <div onclick="setValue('Degree', 'SIDDHA')">SIDDHA</div>
                <div onclick="setValue('Degree', 'PAEDIATRICIAN')">PAEDIATRICIAN</div>
                <div onclick="setValue('Degree', 'ORTHOPEDIC SURGEON')">ORTHOPEDIC SURGEON</div>
            </div>
        </div>

        <div class="input-group" onclick="toggleDropdown('completion-dropdown')">
            <label for="Completion">Completion</label>
            <input type="text" id="Completion" readonly placeholder="Select Completion">
            <span class="arrow">⌄</span>
            <div class="dropdown" id="completion-dropdown">
                <div onclick="setValue('Completion', 'YES')">YES</div>
                <div onclick="setValue('Completion', 'NO')">NO</div>
            </div>
        </div>

        <div class="input-group" onclick="toggleDropdown('country-dropdown')">
            <label for="Country">Country</label>
            <input type="text" id="country" readonly placeholder="Select Country">
            <span class="arrow">⌄</span>
            <div class="dropdown" id="country-dropdown">
                <div onclick="setValue('country', 'India')">India</div>
                <div onclick="setValue('country', 'USA')">USA</div>
                <div onclick="setValue('country', 'UK')">UK</div>
                <div onclick="setValue('country', 'Canada')">Canada</div>
                <div onclick="setValue('country', 'France')">France</div>
                <div onclick="setValue('country', 'Germany')">Germany</div>
            </div>
        </div>

        <div class="input-group" onclick="toggleDropdown('institute-dropdown')">
            <label for="Institute">Institute Name</label>
            <input type="text" id="institute" readonly placeholder="Select Institute">
            <span class="arrow">⌄</span>
            <div class="dropdown" id="institute-dropdown">
                <div onclick="setValue('institute', 'COIMBATORE MEDICAL COLLEGE')">COIMBATORE MEDICAL COLLEGE</div>
                <div onclick="setValue('institute', 'CHENNAI MEDICAL COLLEGE')">CHENNAI MEDICAL COLLEGE</div>
                <div onclick="setValue('institute', 'AIIMS')">AIIMS</div>
                <div onclick="setValue('institute', 'CMC Vellore')">CMC Vellore</div>
                <div onclick="setValue('institute', 'Christian Medical College')">Christian Medical College</div>
            </div>
        </div>

        <div class="input-group">
            <label for="Medical Registration Number">Medical Registration Number</label>
            <input type="text" id="reg-number" placeholder="Enter your Medical Registration Number" class="highlight">
        </div>

        <button class="continue-btn" onclick="submitForm()">Continue</button>
    </div>

    <script>
        function toggleDropdown(id) {
            document.querySelectorAll('.dropdown').forEach(dropdown => {
                if (dropdown.id !== id) dropdown.classList.remove('active');
            });
            document.getElementById(id).classList.toggle('active');
        }

        function setValue(fieldId, value) {
            document.getElementById(fieldId).value = value;
            document.getElementById(fieldId + '-dropdown').classList.remove('active');
        }

        function submitForm() {
          
            window.location.href = "home.html";
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration</title>
    <style>
          @font-face {
        font-family: 'Lufga';
        src: url('fonts/Lufga.ttf') format('truetype'); 
        font-weight: normal;
        font-style: normal;
    }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lufga', sans-serif;
        }
        body {
            background: url('doce.webp') no-repeat center center/cover; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Lufga', sans-serif;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            width: 450px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            font-family: 'Lufga', sans-serif;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 10px;
            font-family: 'Lufga', sans-serif;
        }

        h4 {
            font-size: 18px;
            margin-bottom: 20px;
            font-family: 'Lufga', sans-serif;
            color: #555;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
            font-family: 'Lufga', sans-serif;
        }

        .input-group label {
            position: absolute;
            left: 10px;
            top: -8px;
            background-color: rgb(248, 247, 247);
            padding: 0 4px;
            font-size: 8px;
            color: #507db0;
            font-family: 'Lufga', sans-serif;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 10px;
            outline: none;
            font-family: 'Lufga', sans-serif;
            
        }

        .input-group input:focus {
            border-color: #007bff;
            font-family: 'Lufga', sans-serif;
        }

        .continue-btn {
            width: 100%;
            padding: 12px;
            background: #0b1467d2;
            font-family: 'Lufga', sans-serif;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        .continue-btn:hover {
            background: #0056b3;
            font-family: 'Lufga', sans-serif;
        }

        .login-link {
            margin-top: 15px;
            font-size: 14px;
            font-family: 'Lufga', sans-serif;
        }

        .login-link a {
            color:  #0b1467d2;
            text-decoration: none;
            font-family: 'Lufga', sans-serif;
        }

        .login-link a:hover {
            text-decoration: underline;
            font-family: 'Lufga', sans-serif;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Welcome Doctor!</h2>
        <h4>Register your details and start</h4>

        <div class="input-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="Enter your first name">
        </div>

        <div class="input-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Enter your last name">
        </div>
        <div class="input-group">
            <label for="email">Email ID</label>
            <input type="email" id="email" placeholder="Enter your email id">
        </div>
        <button class="continue-btn" onclick="submitForm()">Continue</button>
        <div class="login-link">
            <h5>Do you have an account? <a href="login.html">Login</a></h5>
        </div>
    </div>
    <script>
        function submitForm() {
            let firstName = document.getElementById('firstName').value;
            let lastName = document.getElementById('lastName').value;
            let email = document.getElementById('email').value;
    
            
            window.location.href = "details.html"; 
        }
    </script>
    

</body>
</html>
